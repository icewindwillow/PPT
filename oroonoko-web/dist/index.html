<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="An interactive literary presentation on travel writing in Aphra Behn's Oroonoko." />
  <title>Oroonoko: Through the Traveller's Eye</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1220'/%3E%3Cpath d='M16 43c12-9 22-14 32-26M16 43c9 3 19 4 32-1' stroke='%23d58b52' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='43' r='4' fill='%23d58b52'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #eef1ec;
      --muted: #a4afb4;
      --deep: #08111d;
      --deep-2: #0d1c2a;
      --panel: rgba(17, 32, 46, .78);
      --panel-strong: rgba(21, 40, 56, .94);
      --copper: #d58b52;
      --copper-soft: #f0b678;
      --green: #6ea080;
      --red: #e17d64;
      --line: rgba(225, 229, 220, .14);
      --shadow: 0 24px 80px rgba(0,0,0,.3);
    }
    * { box-sizing: border-box; }
    html { background: var(--deep); scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: radial-gradient(circle at 75% 12%, rgba(64, 101, 102, .25), transparent 35%), var(--deep); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button { font: inherit; color: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 230px minmax(0, 1fr); }
    .rail { position: fixed; z-index: 5; inset: 0 auto 0 0; width: 230px; padding: 28px 20px; border-right: 1px solid var(--line); background: rgba(7, 15, 25, .84); backdrop-filter: blur(18px); display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 10px; letter-spacing: .02em; font-size: 13px; text-transform: uppercase; color: var(--muted); }
    .brand-mark { width: 25px; height: 25px; border: 1px solid var(--copper); border-radius: 50%; position: relative; }
    .brand-mark::after { content: ""; position: absolute; width: 7px; height: 7px; border: 1px solid var(--copper); border-radius: 50%; top: 7px; left: 7px; }
    .rail h1 { margin: 42px 0 26px; font: 600 clamp(23px, 2.2vw, 28px)/1.08 Georgia, serif; letter-spacing: -.03em; }
    .rail h1 em { color: var(--copper-soft); font-weight: 400; }
    .scene-list { display: grid; gap: 7px; }
    .scene-btn { appearance: none; border: 0; border-left: 1px solid transparent; padding: 9px 10px; text-align: left; background: transparent; color: var(--muted); cursor: pointer; transition: .25s ease; border-radius: 0 8px 8px 0; }
    .scene-btn:hover { color: var(--ink); background: rgba(255,255,255,.04); }
    .scene-btn.active { border-left-color: var(--copper); color: var(--ink); background: rgba(213, 139, 82, .1); }
    .scene-btn small { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--copper); margin-bottom: 3px; }
    .scene-btn span { font-size: 12px; }
    .rail-foot { margin-top: auto; color: #6e7a80; font-size: 11px; line-height: 1.5; }
    .stage { grid-column: 2; min-width: 0; position: relative; overflow: hidden; }
    .topbar { position: fixed; z-index: 4; top: 0; right: 0; left: 230px; display: flex; justify-content: flex-end; gap: 10px; padding: 21px 40px; pointer-events: none; }
    .topbar button { pointer-events: auto; }
    .ghost-btn, .solid-btn { border: 1px solid var(--line); border-radius: 999px; background: rgba(8, 17, 29, .64); padding: 9px 14px; color: var(--muted); cursor: pointer; transition: .2s ease; font-size: 12px; }
    .ghost-btn:hover, .ghost-btn.active { border-color: rgba(213,139,82,.65); color: var(--copper-soft); }
    .solid-btn { color: #111c23; background: var(--copper); border-color: var(--copper); font-weight: 700; }
    .solid-btn:hover { background: var(--copper-soft); transform: translateY(-1px); }
    .scene { min-height: 100vh; padding: 100px clamp(28px, 6vw, 100px) 90px; display: grid; align-items: center; position: relative; isolation: isolate; }
    .scene::before { content: ""; position: absolute; inset: 0; z-index: -2; background: linear-gradient(90deg, rgba(8,17,29,.96) 0%, rgba(8,17,29,.84) 34%, rgba(8,17,29,.18) 100%); }
    .scene::after { content: ""; position: absolute; inset: 0; z-index: -3; opacity: .22; background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 45px 45px; mask-image: linear-gradient(90deg, black, transparent 85%); }
    .hero-scene { min-height: 100vh; background: linear-gradient(90deg, rgba(8,17,29,.55), transparent 60%), url('hero.png') center/cover; }
    .hero-scene::before { background: linear-gradient(90deg, rgba(8,17,29,.97) 0%, rgba(8,17,29,.77) 42%, rgba(8,17,29,.12) 100%); }
    .hero-scene::after { opacity: .1; }
    .content { width: min(880px, 100%); }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--copper-soft); letter-spacing: .18em; font-size: 11px; text-transform: uppercase; margin-bottom: 22px; }
    .eyebrow::before { content: ""; width: 32px; height: 1px; background: var(--copper); }
    h2 { margin: 0; max-width: 900px; font: 500 clamp(46px, 8vw, 96px)/.94 Georgia, serif; letter-spacing: -.065em; }
    h2 em { color: var(--copper-soft); font-weight: 400; }
    .hero-copy { max-width: 570px; margin-top: 27px; color: #c8d0ce; font: 400 clamp(18px, 2.4vw, 23px)/1.45 Georgia, serif; }
    .hero-question { max-width: 550px; margin: 42px 0 30px; font: italic 24px/1.35 Georgia, serif; color: #fff; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .microcopy { font-size: 11px; color: var(--muted); margin-left: 4px; }
    .section-inner { width: min(1050px, 100%); }
    .section-title { margin-bottom: 18px; font: 500 clamp(38px, 5.5vw, 68px)/1 Georgia, serif; letter-spacing: -.05em; max-width: 720px; }
    .lede { max-width: 700px; color: #bdc8c9; font: 18px/1.55 Georgia, serif; margin: 0 0 35px; }
    .scene-meta { color: var(--copper-soft); font-size: 12px; letter-spacing: .06em; margin-bottom: 24px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 20px; min-height: 155px; transition: .25s ease; cursor: pointer; position: relative; overflow: hidden; }
    .card:hover { border-color: rgba(213, 139, 82, .48); transform: translateY(-3px); }
    .card.selected { border-color: var(--copper); background: rgba(213, 139, 82, .12); }
    .card.selected::after { content: "✓"; position: absolute; top: 15px; right: 15px; color: var(--copper-soft); }
    .card h3 { margin: 0 0 11px; font-size: 15px; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .card .icon { display: block; color: var(--copper); font-size: 24px; margin-bottom: 15px; }
    .result-line { min-height: 34px; margin-top: 23px; color: var(--copper-soft); font: italic 19px Georgia, serif; }
    .manuscript { margin-top: 28px; max-width: 960px; border: 1px solid rgba(213,139,82,.36); border-radius: 15px; background: linear-gradient(135deg, rgba(213,139,82,.09), rgba(255,255,255,.02)); overflow: hidden; }
    .manuscript-head { display: flex; justify-content: space-between; gap: 14px; padding: 13px 18px; border-bottom: 1px solid var(--line); color: var(--copper-soft); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    .manuscript-body { padding: 20px 22px 22px; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 31px); }
    .manuscript-intro { margin: 0 0 16px; color: #c5cfce; font: italic 17px/1.45 Georgia, serif; }
    .folio-line { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 11px 0; border-top: 1px solid rgba(255,255,255,.1); animation: enter .45s ease both; }
    .folio-line::before { content: "✦"; color: var(--copper); padding-top: 2px; }
    .folio-line strong { display: block; margin-bottom: 3px; color: #f0c28e; font: 500 16px Georgia, serif; }
    .folio-line span { color: #aebbbc; font: 14px/1.5 Georgia, serif; }
    .folio-empty { margin: 0; color: var(--muted); font-size: 13px; }
    .choice-row { display: flex; flex-wrap: wrap; gap: 9px; margin: 23px 0; }
    .choice { border: 1px solid var(--line); background: rgba(255,255,255,.03); border-radius: 999px; padding: 10px 14px; color: var(--muted); cursor: pointer; transition: .2s ease; }
    .choice:hover, .choice.selected { border-color: var(--copper); color: var(--copper-soft); background: rgba(213, 139, 82, .1); }
    .quote-panel { margin-top: 30px; border-left: 2px solid var(--copper); padding: 2px 0 2px 22px; max-width: 770px; }
    blockquote { margin: 0; font: italic 25px/1.36 Georgia, serif; color: #f4f2e9; }
    cite { display: block; margin-top: 13px; color: var(--muted); font-size: 12px; font-style: normal; }
    .chain { display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; gap: 0; margin: 28px 0 20px; max-width: 800px; }
    .chain-step { border: 1px solid var(--line); background: var(--panel); padding: 24px 18px; text-align: center; position: relative; }
    .chain-step:not(:last-child)::after { content: "→"; position: absolute; z-index: 2; right: -17px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--copper); background: var(--deep-2); border: 1px solid var(--line); }
    .chain-step strong { display: block; font: 500 21px Georgia, serif; }
    .chain-step small { color: var(--muted); display: block; margin-top: 7px; font-size: 11px; }
    .chain-step.active { border-color: var(--copper); background: rgba(213,139,82,.13); box-shadow: 0 0 0 1px rgba(213,139,82,.18) inset; }
    .authority-progress { display: flex; justify-content: space-between; gap: 16px; max-width: 800px; margin: 0 0 18px; color: var(--copper-soft); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .authority-ledger { max-width: 800px; border: 1px solid var(--line); border-radius: 13px; padding: 15px 18px; background: rgba(255,255,255,.025); }
    .authority-ledger-head { display: flex; justify-content: space-between; gap: 15px; color: #c4cece; font: italic 16px/1.45 Georgia, serif; }
    .authority-ledger-list { display: grid; gap: 0; margin-top: 13px; }
    .authority-entry { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid rgba(255,255,255,.09); animation: enter .35s ease both; }
    .authority-entry::before { content: "✦"; color: var(--copper); padding-top: 2px; }
    .authority-entry strong { display: block; color: #f0c28e; font: 500 16px Georgia, serif; }
    .authority-entry span { display: block; margin-top: 4px; color: #aebbbc; font: 13px/1.5 Georgia, serif; }
    .authority-empty { margin: 14px 0 2px; color: var(--muted); font-size: 12px; }
    .tension { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 800px; margin-top: 28px; }
    .tension div { border-top: 1px solid var(--line); padding-top: 13px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .tension strong { display: block; color: var(--ink); margin-bottom: 5px; }
    /* Scene 04 — witness authority */
    .authority-scene { background: radial-gradient(circle at 78% 20%, rgba(213,139,82,.1), transparent 34%), linear-gradient(120deg, rgba(8,17,29,.98), rgba(10,24,32,.94)); }
    .authority-scene::after { opacity: .13; background-size: 34px 34px; }
    .witness-intro { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(270px, .85fr); gap: 32px; align-items: end; margin-bottom: 30px; }
    .witness-intro .lede { margin-bottom: 0; }
    .witness-question { margin: 0; color: #fff0d4; font: italic 27px/1.2 Georgia, serif; max-width: 370px; }
    .witness-question::before { content: "“"; color: var(--copper); font-size: 56px; line-height: 0; vertical-align: -19px; margin-right: 5px; }
    .witness-stage { position: relative; border: 1px solid rgba(213,139,82,.34); border-radius: 18px; padding: 27px 28px 26px; background: linear-gradient(130deg, rgba(213,139,82,.1), rgba(255,255,255,.025) 50%, rgba(57,99,100,.14)); overflow: hidden; }
    .witness-stage::before { content: "FIRST-PERSON MANUSCRIPT / FOLIO 17"; position: absolute; top: 14px; right: 20px; color: rgba(240,182,120,.7); font-size: 9px; letter-spacing: .16em; }
    .witness-core { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 27px; align-items: center; }
    .witness-i { position: relative; display: grid; place-items: center; min-height: 164px; border-right: 1px solid rgba(213,139,82,.28); }
    .witness-i strong { color: #fff2d5; font: 500 148px/.75 Georgia, serif; letter-spacing: -.18em; transform: translateX(-7px); text-shadow: 0 0 28px rgba(213,139,82,.18); }
    .witness-i span { position: absolute; bottom: 1px; color: var(--copper-soft); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
    .authority-chain { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; align-items: center; }
    .authority-node { position: relative; min-height: 96px; display: flex; flex-direction: column; justify-content: center; padding: 14px 13px; border: 1px solid rgba(255,255,255,.14); background: rgba(8,17,29,.45); transition: .3s ease; }
    .authority-node:not(:last-child)::after { content: "→"; position: absolute; z-index: 1; right: -18px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: #637274; background: #10232c; border: 1px solid rgba(255,255,255,.14); font-size: 18px; transition: .3s ease; }
    .authority-node.active { border-color: var(--copper); background: rgba(213,139,82,.13); box-shadow: inset 0 0 0 1px rgba(213,139,82,.15), 0 9px 24px rgba(0,0,0,.12); }
    .authority-node.active:not(:last-child)::after { color: var(--copper-soft); border-color: rgba(213,139,82,.6); }
    .authority-node small { color: var(--copper-soft); font-size: 9px; letter-spacing: .15em; text-transform: uppercase; }
    .authority-node strong { margin-top: 8px; color: #f7f1e6; font: 500 20px Georgia, serif; }
    .authority-node span { margin-top: 6px; color: #9eadad; font-size: 11px; line-height: 1.35; }
    .authority-node.active span { color: #d7c4aa; }
    .witness-prompt { margin: 18px 0 0; color: #aebbbc; font: 14px/1.5 Georgia, serif; }
    .witness-prompt strong { color: #f0c28e; font-weight: 500; }
    .authority-evidence { margin-top: 23px; }
    .authority-evidence-label { display: flex; justify-content: space-between; gap: 12px; color: var(--copper-soft); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    .authority-evidence-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; margin-top: 11px; }
    .authority-evidence-card { appearance: none; text-align: left; min-height: 145px; padding: 17px 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.035); cursor: pointer; transition: .25s ease; }
    .authority-evidence-card:hover { transform: translateY(-3px); border-color: rgba(213,139,82,.62); }
    .authority-evidence-card.active { border-color: var(--copper); background: linear-gradient(150deg, rgba(213,139,82,.18), rgba(213,139,82,.05)); box-shadow: inset 0 0 0 1px rgba(213,139,82,.12); }
    .authority-evidence-card .step-index { display: inline-grid; place-items: center; width: 22px; height: 22px; border: 1px solid rgba(213,139,82,.55); border-radius: 50%; color: var(--copper-soft); font-size: 10px; }
    .authority-evidence-card strong { display: block; margin: 14px 0 7px; color: #f4d09f; font: 500 18px Georgia, serif; }
    .authority-evidence-card span { display: block; color: #9eadad; font-size: 11px; line-height: 1.45; }
    .authority-evidence-card.active span { color: #d4c3aa; }
    .authority-reading { margin-top: 13px; min-height: 62px; padding: 15px 17px; border-left: 2px solid var(--copper); background: rgba(8,17,29,.3); color: #c6d0ce; font: 15px/1.5 Georgia, serif; }
    .authority-reading strong { color: #fff0d4; font-weight: 500; }
    .archive-stage { margin-top: 28px; border: 1px solid rgba(213,139,82,.3); border-radius: 18px; padding: 23px 25px 26px; background: linear-gradient(135deg, rgba(11,29,37,.94), rgba(19,44,46,.75)); }
    .archive-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
    .archive-head h3 { margin: 0; color: #f6ead6; font: 500 22px Georgia, serif; }
    .archive-head span { color: #91a2a3; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    .archive-rack { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; padding: 19px 13px 15px; border: 1px solid rgba(255,255,255,.1); background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 28px), rgba(5,14,21,.42); }
    .archive-rack::before, .archive-rack::after { content: ""; position: absolute; left: 0; right: 0; height: 5px; background: rgba(213,139,82,.38); box-shadow: 0 1px 0 rgba(255,255,255,.1); }
    .archive-rack::before { top: 0; } .archive-rack::after { bottom: 0; }
    .archive-file { min-height: 112px; padding: 13px 11px; border-left: 3px solid rgba(111,154,133,.58); background: linear-gradient(180deg, rgba(47,88,88,.5), rgba(24,49,53,.45)); }
    .archive-file span { display: block; color: #8ea7a4; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .archive-file strong { display: block; margin-top: 11px; color: #d9e0d7; font: 500 14px Georgia, serif; }
    .archive-file small { display: block; margin-top: 8px; color: #92a7a8; font-size: 10px; line-height: 1.35; }
    .archive-file.empty { position: relative; border: 1px dashed rgba(240,182,120,.8); background: rgba(213,139,82,.08); }
    .archive-file.empty::after { content: "ink pending"; position: absolute; right: 8px; bottom: 8px; color: rgba(240,182,120,.55); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
    .archive-file.empty.filled { animation: archiveFill .75s ease both; border-style: solid; background: linear-gradient(180deg, rgba(213,139,82,.24), rgba(80,65,47,.26)); }
    .archive-file.empty.filled::after { content: "entered"; color: var(--copper-soft); }
    @keyframes archiveFill { from { opacity: .25; transform: translateY(8px) rotate(-1deg); } to { opacity: 1; transform: translateY(0) rotate(0); } }
    .archive-caption { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-top: 16px; }
    .archive-caption p { margin: 0; max-width: 590px; color: #adbdbc; font: 14px/1.5 Georgia, serif; }
    .archive-caption q { color: #f0c28e; font-style: italic; }
    .tension-reveal { margin-top: 20px; }
    .tension-button { border: 1px solid rgba(213,139,82,.55); border-radius: 999px; padding: 10px 15px; color: #f0c28e; background: rgba(213,139,82,.08); cursor: pointer; font-size: 12px; transition: .2s ease; }
    .tension-button:hover, .tension-button.active { color: #111c23; background: var(--copper-soft); }
    .tension-reading { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 17px; border: 1px solid rgba(213,139,82,.28); overflow: hidden; }
    .tension-reading article { min-height: 145px; padding: 21px 22px; }
    .tension-reading article:first-child { border-right: 1px solid rgba(255,255,255,.12); background: linear-gradient(145deg, rgba(71,78,81,.4), rgba(32,43,49,.3)); }
    .tension-reading article:last-child { background: linear-gradient(145deg, rgba(91,71,46,.35), rgba(35,48,50,.25)); }
    .tension-reading small { color: #c3a37f; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; }
    .tension-reading h4 { margin: 10px 0 8px; color: #f5eadb; font: 500 21px Georgia, serif; }
    .tension-reading p { margin: 0; color: #adbdbc; font: 13px/1.5 Georgia, serif; }
    .authority-conclusion { margin-top: 28px; padding: 20px 22px; border-top: 1px solid var(--copper); background: linear-gradient(180deg, rgba(213,139,82,.13), transparent); color: #fff0d4; font: italic 24px/1.35 Georgia, serif; max-width: 850px; }
    .observe-stage { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr); gap: 35px; align-items: center; }
    .landscape { height: 330px; border-radius: 18px; position: relative; overflow: hidden; background: linear-gradient(120deg, rgba(8,17,29,.5), rgba(8,17,29,.06)), url('hero.png') 72% center/cover; box-shadow: var(--shadow); }
    .landscape::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,17,29,.18), rgba(8,17,29,.52)); }
    .landscape::after { content: "SURINAM"; position: absolute; inset: 20px 24px auto; color: rgba(255,244,212,.7); letter-spacing: .38em; font: 12px Georgia, serif; }
    .landscape .tag { position: absolute; display: none; border: 1px solid var(--copper-soft); color: #ffedcb; background: rgba(8,17,29,.78); padding: 5px 8px; border-radius: 5px; font-size: 11px; }
    .landscape.observing .tag.one { display: block; top: 31%; left: 18%; }
    .landscape.observing .tag.two { display: block; top: 61%; right: 22%; }
    .landscape.observing .tag.three { display: block; bottom: 17%; left: 40%; }
    .landscape.classified { filter: saturate(.55) contrast(1.12); }
    .landscape.classified .tag { display: block; border-style: dashed; }
    .step-copy h3 { margin: 0; font: 500 30px Georgia, serif; }
    .step-copy p { color: var(--muted); line-height: 1.6; }

    /* Scene 06 — reciprocal looking without equal power */

    /* Scene 07 — a narrator between frameworks */
    .position-scene { min-height: 100vh; padding: 82px clamp(22px, 4.6vw, 70px) 30px; display: block; background: radial-gradient(circle at 25% 34%, rgba(213,139,82,.12), transparent 34%), #08111d; }

    /* Scene 08 — return to the page */

    .return-page { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 13px; }

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 1100px;
      margin: 0 0 22px;

    .significance-statement {
      min-height: 148px;
      padding: 18px 19px;

    .return-themes { min-height: 0; display: grid; grid-template-rows: auto repeat(3, 1fr); gap: 8px; padding: 17px; border: 1px solid rgba(255,255,255,.13); border-radius: 16px; background: rgba(13,31,37,.82); }

    .theme-card { appearance: none; display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 12px; align-items: center; padding: 11px; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; color: #aebdbc; background: rgba(255,255,255,.035); cursor: pointer; text-align: left; transition: .25s ease; }

    /* Scene 08 — interactive reassembly */
    .return-scene .section-inner { width: min(1180px, 100%); height: auto; min-height: calc(100vh - 112px); }
    .return-page { height: auto; }

  <div class="app">

  <script>
    const scenes = [
      { key: 'entry', number: '00', short: 'Entry', title: "Through the Traveller's Eye", label: 'Prologue' },
      { key: 'conditions', number: '01', short: 'Conditions', title: 'How did travel become knowledge?', label: '01 · Origins' },
      { key: 'boundaries', number: '02', short: 'Boundaries', title: 'Where does a genre begin?', label: '02 · Boundaries' },
      { key: 'authority', number: '03', short: 'Authority', title: 'How does witness authority form?', label: '03 · Witnessing' },
      { key: 'description', number: '04', short: 'Description', title: 'When a landscape becomes knowledge', label: '04 · Describing' },
      { key: 'encounter', number: '05', short: 'Encounter', title: 'When the gaze turns back', label: '05 · Encounter' },
      { key: 'position', number: '06', short: 'Position', title: 'A narrator between frameworks', label: '06 · Position' },
      { key: 'return', number: '07', short: 'Return', title: 'What the story leaves behind', label: '07 · Significance' }
    ];
    let current = 0;
    const boundaryFeatures = [
      ['First-person narration', 'voice', 'A traveller’s “I” can sound like testimony, while a novelist can use the same voice to stage a world.'],
      ['Eyewitness claims', 'authority', 'The promise of having been there can support documentary rhetoric and fictional verisimilitude alike.'],
      ['Detailed description', 'observation', 'A catalogue of detail turns experience into knowledge, whether the scene is reported or shaped.'],
      ['Movement through places', 'sequence', 'A route can record a journey and also provide the structure of a story.']
    ];
    const boundaryZones = ['documentary', 'travel', 'fiction'];
    const authoritySteps = [
      ['presence', 'Being there', 'presence', 'The “I” was there.', 'Physical presence turns a location into a claim: travel writing builds authority through rhetorical authenticity and first-person eyewitness authority (Zhang 64–65). Pratt calls the observing subject a “seeing-man”, whose on-site witnessing carries representational power (Pratt 2008: 9–10).'],
      ['testimony', 'Claiming truth', 'testimony', '“Truth” rather than fabricated adventures.', 'The account borrows travel writing’s promise of firsthand testimony to resist the charge of invention. The narrator frames the story as true history based on personal observation and authentic testimony.'],
      ['archive', 'Preserving an otherwise unrecorded story', 'authority', '“only a female pen”.', 'The phrase sounds modest, yet it names the narrator as custodian of a history official archives failed to preserve. Female authorship becomes both a constraint within male-centred literary culture and a resource for preserving Oroonoko’s story.']
    ];
    const state = { conditions: new Set(), boundaries: new Set(), boundaryPlacements: boundaryFeatures.map(() => new Set()), activeBoundaryFeature: null, authoritySteps: new Set(), authorityTension: false, description: 'observe', descriptionCompare: false, reversed: false, encounterMediation: false, position: new Set(), returnFocus: null, returnAssembled: false, returnBalance: 52, returnDepth: 46 };
    const stage = document.getElementById('stage');

      sceneList.innerHTML = scenes.map((s, i) => `<button class="scene-btn ${i === current ? 'active' : ''}" data-go="${i}"><small>${s.number || String(i + 1).padStart(2, '0')}</small><span>${s.short}</span></button>`).join('');
      progressBar.style.width = `${((current + 1) / scenes.length) * 100}%`;
    }
    let shouldAnimate = true;
    function shell(inner, cls = '') {
      const s = scenes[current];
      return `<section class="scene ${cls}" data-key="${s.key}"><div class="section-inner ${shouldAnimate ? 'enter' : ''}">${inner}</div></section>`;
    }
    function render(animate = true) {
      shouldAnimate = animate;
      const s = scenes[current];
      let html = '';
      if (s.key === 'entry') html = shell(`<div class="content"><div class="eyebrow">${s.label} · Aphra Behn's Oroonoko</div><h2>Through the <em>Traveller's Eye</em></h2><p class="hero-copy">A visual reading of witnessing, describing, and representing a colonial world.</p><p class="hero-question">Who gets to describe the world—and whose account becomes history?</p><div class="hero-actions"><button class="solid-btn" data-next>Enter the manuscript <span aria-hidden="true">→</span></button><span class="microcopy">8 scenes · keyboard ready</span></div></div>`, 'hero-scene');
      if (s.key === 'conditions') {
        const threads = [
          ['◌', 'Experience', 'Empiricism gave travel a new intellectual status.', 'Locke’s tabula-rasa theory made lived sensation a source of knowledge. Travel could become a disciplined way of learning: “an articulated, systematic empiricism made travelling about the world and seeing the new and different ‘something like an obligation for the person conscientious about developing the mind and accumulating knowledge’” (Buzard 2002: 37).'],

small>folio 16</small><strong>${isActive('archive') ? 'Oroonoko' : 'empty slot'}</strong></div><div class="archive-mini-file"><small>folio 17</small><strong>Aftermath</strong></div></div><button class="tension-button-compact ${state.authorityTension ? 'active' : ''}" data-authority="__tension">${state.authorityTension ? 'Close tension' : 'Read the tension'}<br><span>“only a female pen”</span></button></div>${tensionPanel}<div class="authority-conclusion-compact">The presentation reads gender as both a constraint and a source of authority.</div></section></div><div class="source-copy"><p>Travel writing builds textual authority through rhetorical authenticity and first-person eyewitness authority <span class="citation">(Zhang 64–65)</span>. Early-modern writers framed their accounts as firsthand observation and true testimony in order to persuade audiences.</p><p>Pratt calls the normative white male European observing subject the “seeing-man”, whose performed on-site witnessing exercises representational power within the colonial contact zone <span class="citation">(Pratt 2008: 9–10)</span>.</p><blockquote>“Truth” rather than fabricated adventures.</blockquote><p>The narrator’s physical presence in Surinam provides eyewitness proof and positions her as an intermediary between readers and an unfamiliar overseas space.</p><blockquote>“only a female pen”</blockquote><p>The phrase can sound like a limitation inside male-centred literary culture, while the absence of official records makes Behn the custodian of Oroonoko’s otherwise-lost history.</p></div></div>`, 'authority-scene');

pan><div class="scale-line"></div></div><div class="compare-copy"><small>${state.descriptionCompare ? 'A familiar measure enters the frame' : 'The next lens'}</small>${state.descriptionCompare ? '<blockquote>“about half the length of the Mall here”</blockquote><blockquote>“Not all the Gardens of boasted Italy can produce a Shade to out-vie this”</blockquote><cite>The Mall · London · Italian gardens</cite>' : '<blockquote>A place becomes readable through relation.</blockquote><cite>Reveal the comparison to continue.</cite>'}</div><div class="compare-view europe"><span>European reference</span><div class="scale-line"></div></div><button class="compare-action" data-compare>${state.descriptionCompare ? 'Hide comparison' : 'Reveal the comparison'}<br><span>${state.descriptionCompare ? 'metaphorical scale' : 'open lens ↗'}</span></button><div class="comparison-note">The measure is a metaphor, not a historical survey.</div></section><div class="description-conclusion"><strong>Description makes a place intelligible through a cultural frame.</strong></div><div class="source-copy"><p>Behn constructs Surinam as an observable and classifiable space through detailed descriptions of its inhabitants, animals, natural resources, and colonial landscapes. The accumulation of visual details creates the impression of direct observation and lets the narrator appear as an empirical witness.</p><p>She makes the unfamiliar readable through European reference points:</p><blockquote>“about half the length of the Mall here”</blockquote><p>The grove is measured against a familiar urban space. The comparison creates a bridge between Surinam and the reader’s existing geographical imagination.</p><blockquote>“Not all the Gardens of boasted Italy can produce a Shade to out-vie this”</blockquote><p>The landscape is judged through European artistic and architectural standards, even as Surinam is allowed to surpass celebrated European spaces.</p></div></div>`, 'description-scene');

ugh the narrator.</div><div class="source-copy"><blockquote>“By ‘contact zone,’ I use to refer to the space of imperial encounters, the space in which peoples geographically and historically separated come into contact with each other and establish ongoing relations, usually involving conditions of coercion, radical inequality, and intractable conflict.”</blockquote><cite>Pratt 2008: 7</cite><p>Pratt’s traveller and “travelee” pairing draws attention to the co-presence and radically asymmetrical power relations between European visitors and local communities (Pratt 2008: 7). Through transculturation, marginalised or colonised subjects can adapt and contest European representational modes, producing counter-narratives such as autoethnographic texts (Pratt 2008: 8–9).</p><p>Indigenous curiosity makes Europeans visible within the encounter, but their reactions are still filtered through the European narrator’s perspective. The contact zone is reciprocal without becoming equal. The strategy of anti-conquest can present the European observer as an innocent witness while reconstructing non-European peoples as textual objects for metropolitan readers <span class="citation">(Pratt 2008: 9, 51–52)</span>.</p></div></div>`, 'encounter-scene');

he exclusivity of masculine travel authority. As a European narrator, she still interprets colonial subjects through a European cultural framework.</p><p>The two positions should be held together: gender can challenge one hierarchy while the colonial representational frame continues to shape what becomes visible and knowable.</p></div></div>`, 'position-scene');

      event.dataTransfer.effectAllowed = 'copy';
      event.dataTransfer.setData('text/plain', card.dataset.feature);
    });
    stage.addEventListener('dragover', event => {
      const zone = event.target.closest('[data-zone]');
      if (!zone) return;
      event.preventDefault();
      zone.classList.add('drop-ready');
    });
    stage.addEventListener('drop', event => {
      const zone = event.target.closest('[data-zone]');
      if (!zone) return;
      event.preventDefault();
      const featureIndex = Number(event.dataTransfer?.getData('text/plain'));
      placeBoundaryFeature(featureIndex, zone.dataset.zone);
    });
    stage.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.hasAttribute('data-next')) return go(current + 1);
      if (button.hasAttribute('data-go')) return go(Number(button.dataset.go));
      if (button.hasAttribute('data-feature')) { state.activeBoundaryFeature = Number(button.dataset.feature); return render(false); }
      if (button.hasAttribute('data-zone') && state.activeBoundaryFeature !== null) return placeBoundaryFeature(state.activeBoundaryFeature, button.dataset.zone);
      if (button.hasAttribute('data-condition')) { const i = Number(button.dataset.condition); state.conditions.has(i) ? state.conditions.delete(i) : state.conditions.add(i); return render(false); }
      if (button.hasAttribute('data-boundary')) { const i = Number(button.dataset.boundary); state.boundaries.has(i) ? state.boundaries.delete(i) : state.boundaries.add(i); return render(false); }
      if (button.hasAttribute('data-authority')) { const key = button.dataset.authority; if (key === '__tension') { state.authorityTension = !state.authorityTension; return render(false); } state.authoritySteps.has(key) ? state.authoritySteps.delete(key) : state.authoritySteps.add(key); return render(false); }
      if (button.hasAttribute('data-tension')) { state.authorityTension = !state.authorityTension; return render(false); }
      if (button.hasAttribute('data-description')) { state.description = button.dataset.description; return render(false); }
      if (button.hasAttribute('data-compare')) { state.descriptionCompare = !state.descriptionCompare; return render(false); }
      if (button.hasAttribute('data-reverse')) { state.reversed = !state.reversed; return render(false); }
      if (button.hasAttribute('data-mediation')) { state.encounterMediation = !state.encounterMediation; return render(false); }
      if (button.hasAttribute('data-position')) { const key = button.dataset.position; state.position.has(key) ? state.position.delete(key) : state.position.add(key); return render(false); }
      if (button.hasAttribute('data-return-theme')) { const key = button.dataset.returnTheme; state.returnFocus = state.returnFocus === key ? null : key; state.returnAssembled = false; return render(false); }
      if (button.hasAttribute('data-return-question')) { state.returnFocus = button.dataset.returnQuestion; state.returnAssembled = false; return render(false); }
      if (button.hasAttribute('data-return-assemble')) { state.returnAssembled = !state.returnAssembled; if (state.returnAssembled) state.returnFocus = null; return render(false); }
    });
    stage.addEventListener('input', event => {
      const input = event.target.closest('[data-return-range]');
      if (!input) return;
      const key = input.dataset.returnRange === 'balance' ? 'returnBalance' : 'returnDepth';
      state[key] = Number(input.value);
      const map = stage.querySelector('.return-archive-map');
      if (map) {
        map.style.setProperty('--balance', state.returnBalance);
        map.style.setProperty('--depth', state.returnDepth);
        const coreLabel = map.querySelector('.geo-core strong');
        if (coreLabel) coreLabel.textContent = state.returnBalance > 60 ? 'VOICE' : state.returnDepth > 60 ? 'CONTACT' : 'FRAME';
      }
      const output = stage.querySelector(`[data-range-value="${input.dataset.returnRange}"]`);
      if (output) output.textContent = `${state[key]}% ${input.dataset.returnRange === 'balance' ? 'voice' : 'encounter'}`;
    });
    function go(index) { current = Math.max(0, Math.min(scenes.length - 1, index)); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); stage.focus({ preventScroll: true }); }
    document.getElementById('overviewBtn').addEventListener('click', () => { document.querySelector('.scene-list')?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); });
    document.addEventListener('keydown', e => { if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return; if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(current + 1); } if (e.key === 'ArrowLeft') { e.preventDefault(); go(current - 1); } if (e.key === 'Home') { e.preventDefault(); go(0); } if (e.key === 'End') { e.preventDefault(); go(scenes.length - 1); } });
    render();
  </script>
</body>
</html>
